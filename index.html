        :root { --primary: #004aad; --accent: #28a745; }
        body { font-family: 'Prompt', sans-serif; margin: 0; background: #f8f9fa; color: #333; }
        
        /* สไลด์โชว์หน้าปก */
        .slider { width: 100%; height: 50vh; overflow: hidden; position: relative; }
        .slider img { width: 100%; height: 100%; object-fit: cover; position: absolute; animation: fade 12s infinite; opacity: 0; }
        .slider img:nth-child(2) { animation-delay: 4s; }
        .slider img:nth-child(3) { animation-delay: 8s; }
        @keyframes fade { 0%, 20% { opacity: 1; } 33%, 100% { opacity: 0; } }
        
        header { text-align: center; padding: 20px; background: white; }
        .container { max-width: 1000px; margin: auto; padding: 20px; }
        
        .contact-top { text-align: center; margin: 20px 0; }
        .btn { display: inline-block; padding: 12px 25px; margin: 5px; border-radius: 50px; text-decoration: none; color: white; font-weight: bold; transition: 0.3s; }
        
        h2 { border-left: 5px solid var(--primary); padding-left: 15px; margin: 40px 0 20px; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
        .gallery img { width: 100%; height: 160px; object-fit: cover; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.3s; }
        .gallery img:hover { transform: scale(1.03); }
        
        .float { position: fixed; right: 20px; bottom: 30px; display: flex; flex-direction: column; gap: 12px; z-index: 2000; }
        .float a { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
    </style>
</head>
