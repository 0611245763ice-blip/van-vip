<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รถตู้เช่า VIP ร้อยเอ็ด</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{ margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; }
        body{ background:#f5f5f5; color:#333; }
        nav{ background:#004aad; padding:15px; position:sticky; top:0; z-index:1000; text-align:center; }
        nav a{ color:#fff; text-decoration:none; margin:0 15px; font-weight:bold; }
        header{ background:linear-gradient(135deg,#0d6efd,#004aad); color:white; padding:60px 20px; text-align:center; }
        section{ max-width:1200px; margin:auto; padding:40px 20px; }
        .cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:20px; }
        .card{ background:white; padding:15px; border-radius:15px; box-shadow:0 5px 15px rgba(0,0,0,.1); }
        .card img{ width:100%; height:200px; object-fit:cover; border-radius:10px; margin-bottom:10px; }
    </style>
</head>
<body>

<nav>
    <a href="#home">หน้าแรก</a>
    <a href="#service">บริการ</a>
    <a href="#gallery">รีวิวลูกค้า</a>
</nav>

<header id="home">
    <h1>🚐 รถตู้เช่า VIP ร้อยเอ็ด</h1>
    <p>รถใหม่ สะอาด คนขับสุภาพ พร้อมบริการทั่วไทย</p>
</header>

<section id="service">
    <h2>บริการของเรา</h2>
    <div class="cards">
        <div class="card"><img src="https://i.ibb.co/68Hn6fL/image-2.png" alt="รับส่งสนามบิน"><h3>รับ-ส่งสนามบิน</h3></div>
        <div class="card"><img src="https://i.ibb.co/sK019s8/image-3.png" alt="ท่องเที่ยว"><h3>ท่องเที่ยวทั่วไทย</h3></div>
        <div class="card"><img src="https://i.ibb.co/VwhR2Z6/image-8.png" alt="บริการVIP"><h3>บริการ VIP ครบวงจร</h3></div>
    </div>
</section>

<section id="gallery">
    <h2>ความประทับใจจากลูกค้า</h2>
    <div class="cards">
        <div class="card"><img src="https://i.ibb.co/q9d80Wz/image-11.png" alt="ลูกค้า"></div>
        <div class="card"><img src="https://i.ibb.co/9vjX05N/image-12.png" alt="ลูกค้า"></div>
        <div class="card"><img src="https://i.ibb.co/M9xWd08/image-13.png" alt="ลูกค้า"></div>
    </div>
</section>

</body>
</html>
