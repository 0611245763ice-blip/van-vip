<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>รถตู้เช่า VIP ร้อยเอ็ด</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; margin: 0; background: #f4f4f4; }
        header { background: #004aad; color: white; padding: 2rem; text-align: center; }
        .container { max-width: 1000px; margin: auto; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; }
    </style>
</head>
<body>

<header>
    <h1>รถตู้เช่า VIP ร้อยเอ็ด</h1>
    <p>บริการท่องเที่ยว รับ-ส่งสนามบิน และงานพิธีการ</p>
</header>

<div class="container">
    <h2>ภาพรถตู้ VIP</h2>
    <div class="grid">
        <div class="card"><img src="van_1.jpg"><p>รถสวย สภาพพร้อมเดินทาง</p></div>
        <div class="card"><img src="van_2.jpg"><p>บริการรับ-ส่ง สนามบินร้อยเอ็ด</p></div>
        <div class="card"><img src="van_3.jpg"><p>พร้อมพาเที่ยวทุกจุดหมาย</p></div>
        <div class="card"><img src="van_5.jpg"><p>เบาะ VIP กว้างขวาง</p></div>
    </div>

    <h2>บรรยากาศภายในรถ</h2>
    <div class="grid">
        <div class="card"><img src="inside_1.jpg"><p>เบาะนวด นั่งสบาย</p></div>
        <div class="card"><img src="inside_2.jpg"><p>ไฟตกแต่งทันสมัย</p></div>
        <div class="card"><img src="inside_3.jpg"><p>สะอาด ปลอดภัย</p></div>
    </div>

    <h2>ความประทับใจจากลูกค้า</h2>
    <div class="grid">
        <div class="card"><img src="client_1.jpg"></div>
        <div class="card"><img src="client_2.jpg"></div>
    </div>
</div>

</body>
</html>
