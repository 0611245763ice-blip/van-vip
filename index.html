<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รถตู้เช่า VIP ร้อยเอ็ด</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; margin: 0; background: #f4f4f4; color: #333; }
        header { background: #004aad; color: white; padding: 2rem; text-align: center; }
        .container { max-width: 1000px; margin: auto; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .card img { width: 100%; height: 250px; object-fit: cover; border-radius: 8px; }
        h2 { text-align: center; margin-top: 40px; }
    </style>
</head>
<body>

<header>
    <h1>รถตู้เช่า VIP ร้อยเอ็ด</h1>
    <p>บริการรถตู้ VIP พร้อมคนขับ เดินทางทั่วไทย สะดวก ปลอดภัย</p>
</header>

<div class="container">
    <h2>ภาพบรรยากาศบริการของเรา</h2>
    <div class="grid">
        <div class="card">
            <img src="https://i.ibb.co/RpjGqCYd/image.png" alt="รถตู้ VIP 1">
            <p>รถใหม่ สะอาด พร้อมให้บริการ</p>
        </div>
        <div class="card">
            <img src="https://i.ibb.co/4ZGh3Td8/image.png" alt="รถตู้ VIP 2">
            <p>บริการด้วยใจ ปลอดภัยทุกเส้นทาง</p>
        </div>
        <div class="card">
            <img src="https://i.ibb.co/zh6ZD4Tv/image.png" alt="รถตู้ VIP 3">
            <p>ภายในกว้างขวาง นั่งสบายระดับ VIP</p>
        </div>
        <div class="card">
            <img src="https://i.ibb.co/KjT2yBBq/image.png" alt="รถตู้ VIP 4">
            <p>คนขับมืออาชีพ ชำนาญเส้นทาง</p>
        </div>
    </div>
</div>

</body>
</html>
